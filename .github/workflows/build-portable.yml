name: Build and publish Zettlr PortableApps
on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: 'Optional stable version, e.g. 4.9.0 (blank = latest published stable)'
        required: false
        type: string
        default: ''
      confirm_brand_rights:
        description: 'I confirm I have required rights/permission for public Zettlr-branded redistribution'
        type: boolean
        default: false
        required: true
permissions:
  contents: write
concurrency:
  group: zettlr-portable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Official source to PortableApps ZIP and .paf.exe
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - name: Check out independent builder
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run cross-platform static builder checks
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Configure Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover published stable Zettlr version
        id: release
        shell: pwsh
        env:
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
        run: python scripts/resolve_release.py
      - name: Check out exact upstream release tag (never branch head)
        uses: actions/checkout@v4
        with:
          repository: Zettlr/Zettlr
          ref: ${{ steps.release.outputs.upstream_tag }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Bind full upstream commit, lockfile and builder commit
        id: identity
        shell: pwsh
        env:
          UPSTREAM_TAG: ${{ steps.release.outputs.upstream_tag }}
          UPSTREAM_VERSION: ${{ steps.release.outputs.upstream_version }}
        run: python scripts/identity.py
      - name: Require permission acknowledgment for public publication
        if: steps.identity.outputs.skip != 'true'
        shell: pwsh
        env:
          BRAND_PERMISSION: ${{ inputs.confirm_brand_rights }}
        run: python scripts/check_publication.py
      - name: Stop redundant build for an already-published identical identity
        if: steps.identity.outputs.skip == 'true'
        shell: pwsh
        run: Write-Host 'Exact version/source/builder release already exists. Skipping build and publication.'
      - name: Adapt audited Zettlr startup source before compilation
        if: steps.identity.outputs.skip != 'true'
        shell: pwsh
        run: python scripts/patch_source.py upstream/source/main.ts
      - name: Verify upstream source patch diff
        if: steps.identity.outputs.skip != 'true'
        shell: pwsh
        run: |
          git -C upstream diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Source patch whitespace error' }
          git -C upstream diff -- source/main.ts | Out-File -FilePath source-adaptation.diff -Encoding utf8
      - name: Prepare verified Pandoc distribution
        if: steps.identity.outputs.skip != 'true'
        shell: pwsh
        run: python scripts/get_pandoc.py upstream
      - name: Install exact Yarn lockfile dependencies
        if: steps.identity.outputs.skip != 'true'
        shell: pwsh
        working-directory: upstream
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { throw 'corepack enable failed' }
          corepack yarn --version
          if ($LASTEXITCODE -ne 0) { throw 'Yarn bootstrap failed' }
          corepack yarn install --immutable
          if ($LASTEXITCODE -ne 0) { throw 'yarn install failed' }
      - name: Build real Zettlr Windows x64 from source, with Pandoc
        if: steps.identity.outputs.skip != 'true'
        shell: pwsh
        working-directory: upstream
        run: |
          # Do NOT set ZETTLR_DISABLE_UPDATE_CHECK or BUNDLE_PANDOC.
          corepack yarn package:win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Source build failed' }
      - name: Compile genuine C++64 PortableApps launcher using Visual Studio
        if: steps.identity.outputs.skip != 'true'
        shell: pwsh
        run: ./scripts/build_launcher.ps1
      - name: Stage PortableApps package and independently validate ZIP
        if: steps.identity.outputs.skip != 'true'
        id: zip
        shell: pwsh
        run: |
          python scripts/stage.py
          if ($LASTEXITCODE -ne 0) { throw 'Stage failed' }
          python scripts/validate_package.py
          if ($LASTEXITCODE -ne 0) { throw 'ZIP validation failed' }
      - name: Build separate installer via pinned shared Package Builder
        if: steps.identity.outputs.skip != 'true'
        id: installer
        uses: vhick/Portable-Package-Builder@v1.0.0
        with:
          source-dir: staging/ZettlrPortable
          output-dir: dist/installer
          engine: custom-nsis
          running-exe: 'App\Zettlr\Zettlr.exe'
          timeout-seconds: '1200'
          package-revision: b1r3
      - name: Locate or install 7-Zip for independent NSIS payload inspection
        if: steps.identity.outputs.skip != 'true'
        shell: pwsh
        run: |
          $seven = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $seven)) {
            choco install 7zip --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Unable to install 7-Zip for installer validation' }
          }
          if (-not (Test-Path -LiteralPath $seven)) { throw '7-Zip unavailable' }
          "SEVEN_ZIP=$seven" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Independently inspect shared installer binary and SHA-256
        if: steps.identity.outputs.skip != 'true'
        shell: pwsh
        env:
          INSTALLER_FILE: ${{ steps.installer.outputs.installer-file }}
          INSTALLER_SHA256: ${{ steps.installer.outputs.installer-sha256 }}
        run: python scripts/validate_installer.py
      - name: Preview exact publication using pinned shared publisher
        if: steps.identity.outputs.skip != 'true'
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: 'dist/*.zip;dist/installer/*.paf.exe'
          tag: ${{ steps.identity.outputs.release_tag }}
          release-title: 'Zettlr ${{ steps.release.outputs.upstream_version }} PortableApps b1r3'
          tag-prefix: portable-
          keep-releases: '3'
          prune: 'false'
          dry-run: 'true'
      - name: Publish validated ZIP and PAF using pinned shared publisher
        if: steps.identity.outputs.skip != 'true'
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: 'dist/*.zip;dist/installer/*.paf.exe'
          tag: ${{ steps.identity.outputs.release_tag }}
          release-title: 'Zettlr ${{ steps.release.outputs.upstream_version }} PortableApps b1r3'
          tag-prefix: portable-
          keep-releases: '3'
          prune: 'false'
          dry-run: 'false'
      - name: Preserve validated ZIP as a fallback when installer generation fails
        if: ${{ failure() && steps.zip.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: validated-zip-installer-failed
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
